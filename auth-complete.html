<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logger inn — nailed</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/logo-mark.svg" />
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#FBF6EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nailed">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main style="min-height:100dvh; display:flex; align-items:center; justify-content:center; font-family: var(--font-body, system-ui);">
    <div style="text-align:center;">
      <div style="font-family: var(--font-display, serif); font-size: 28px; margin-bottom: 8px;">Logger inn …</div>
      <div id="msg" style="color: var(--fg-muted, #666); font-size: 14px;">Et øyeblikk.</div>
    </div>
  </main>
  <script src="/assets/auth.js"></script>
  <script>
    (function () {
      var msg = document.getElementById('msg');
      try {
        var hash = window.location.hash || '';
        if (hash.startsWith('#')) hash = hash.slice(1);
        var params = new URLSearchParams(hash);
        var access = params.get('access_token');
        var refresh = params.get('refresh_token');
        var role = params.get('role');
        var rawRedirect = params.get('redirect') || '/';
        // Defense-in-depth: only allow same-origin paths. Backend already filters,
        // but if a client constructs this URL by hand we still drop off-site jumps.
        var redirect = (typeof rawRedirect === 'string'
          && rawRedirect.length < 512
          && rawRedirect.charAt(0) === '/'
          && rawRedirect.charAt(1) !== '/'
          && rawRedirect.charAt(1) !== '\\') ? rawRedirect : '/';

        if (!access || !refresh) {
          msg.textContent = 'Mangler innloggings-token. Prøv igjen.';
          setTimeout(function () { window.location.replace('/login?error=missing_token'); }, 1500);
          return;
        }
        window.NailedAuth.setTokens({ accessToken: access, refreshToken: refresh, role: role });
        // Strip the fragment from history so tokens don't linger in URL bar.
        window.history.replaceState({}, document.title, '/auth-complete');
        window.location.replace(redirect);
      } catch (err) {
        msg.textContent = 'Innlogging feilet: ' + (err && err.message ? err.message : err);
      }
    })();
  </script>
  <script defer src="/assets/bottom-nav.js"></script>
  <script defer src="/assets/keyboard-inset.js"></script>
  <script defer src="/assets/pwa.js"></script>
</body>
</html>
