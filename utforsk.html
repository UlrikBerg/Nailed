        + '</article>';
    }

    // Brukerens posisjon — fylles inn ved første «Mest relevant»-sortering.
    // Cached i sessionStorage 1 time så vi ikke ber om geo ved hver render.
    var userGeo = null;
    function loadCachedGeo() {
      try {
        var raw = sessionStorage.getItem('nailed.geo');
        if (!raw) return null;
        var g = JSON.parse(raw);
        if (!g || (Date.now() - g.at) > 60 * 60 * 1000) return null;
        return { lat: g.lat, lng: g.lng };
      } catch (_) { return null; }
    }
    function saveGeo(lat, lng) {
      try { sessionStorage.setItem('nailed.geo', JSON.stringify({ lat: lat, lng: lng, at: Date.now() })); } catch (_) {}
    }
    function requestGeo() {
      if (userGeo) return Promise.resolve(userGeo);
      var cached = loadCachedGeo();
      if (cached) { userGeo = cached; return Promise.resolve(cached); }
      if (!navigator.geolocation) return Promise.resolve(null);
      return new Promise(function (resolve) {
        navigator.geolocation.getCurrentPosition(function (pos) {
          userGeo = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          saveGeo(userGeo.lat, userGeo.lng);
          resolve(userGeo);
        }, function () { resolve(null); }, { timeout: 4000, maximumAge: 60 * 60 * 1000 });
      });
    }
    function haversineKm(a, b) {
      var R = 6371;
      var dLat = (b.lat - a.lat) * Math.PI / 180;
      var dLng = (b.lng - a.lng) * Math.PI / 180;
      var lat1 = a.lat * Math.PI / 180;
      var lat2 = b.lat * Math.PI / 180;
      var x = Math.sin(dLat / 2) ** 2 + Math.sin(dLng / 2) ** 2 * Math.cos(lat1) * Math.cos(lat2);
      return 2 * R * Math.asin(Math.sqrt(x));
    }

    function sortedSalons() {
      // Sortering skjer client-side på ALL_SALONS. Original-array forblir
      // urørt så filterResults kan operere på samme rekkefølge serveren ga.
      var list = ALL_SALONS.slice();
      var mode = (document.getElementById('sortSelect') || {}).value || 'relevant';
      function num(v, fallback) { return (v == null || isNaN(v)) ? fallback : Number(v); }
      if (mode === 'price') {
        list.sort(function (a, b) {
          return num(a.min_price, Infinity) - num(b.min_price, Infinity);
        });
      } else if (mode === 'rating') {
        list.sort(function (a, b) {
          return num(b.avg_rating, -1) - num(a.avg_rating, -1);
        });
      } else if (mode === 'next') {
        list.sort(function (a, b) {
          var aOpen = a.is_open_now ? 0 : 1;
          var bOpen = b.is_open_now ? 0 : 1;
          if (aOpen !== bOpen) return aOpen - bOpen;
          var aR = a.reopens_today || 'ZZ';
          var bR = b.reopens_today || 'ZZ';
          return aR.localeCompare(bR);
        });
      } else {
        // relevant: hvis vi har brukerens posisjon, filtrér til ≤30km og
        // sorter etter rating synkende. Uten geo: kun rating-sortering
        // (alle salonger vises).
        if (userGeo) {
          var near = [], far = [];
          list.forEach(function (s) {
            if (s.lat == null || s.lng == null) { far.push(s); return; }
            var km = haversineKm(userGeo, { lat: s.lat, lng: s.lng });
            s._distanceKm = km;
            if (km <= 30) near.push(s); else far.push(s);
          });
          near.sort(function (a, b) { return num(b.avg_rating, -1) - num(a.avg_rating, -1); });
          far.sort(function (a, b) { return num(b.avg_rating, -1) - num(a.avg_rating, -1); });
          list = near.concat(far);
        } else {
          list.sort(function (a, b) { return num(b.avg_rating, -1) - num(a.avg_rating, -1); });
        }
      }
      return list;
    }

    function renderResults() {
      var grid = document.getElementById('resultsGrid');
      var oldCards = grid.querySelectorAll('.service-card');
      oldCards.forEach(function (c) { c.parentNode.removeChild(c); });

      var html = sortedSalons().map(buildCard).join('');
      var stateEl = document.getElementById('resultsState');
      stateEl.insertAdjacentHTML('beforebegin', html);
      lucide.createIcons();
      bindHearts();
      // lucide replaces the <i data-lucide="heart"> placeholder with <svg>,
      // which drops any inline style we put on the <i>. Re-apply fav fill on
      // every card whose button already has .is-favorite (set in buildCard).
      document.querySelectorAll('#resultsGrid .service-card__heart.is-favorite').forEach(function (btn) {
        styleHeartBtn(btn, true);
      });
      moveHeartsOnMobile();
      filterResults();
    }

    // På mobil flyttes hjerteknappen fra .sc2-body til .service-card__photo
    // så den ligger på selve bildet (som på forsidekortene). På desktop blir
    // den værende i body som før — desktop påvirkes ikke.
    function moveHeartsOnMobile() {
      if (!window.matchMedia('(max-width: 720px)').matches) return;
      document.querySelectorAll('#resultsGrid .service-card').forEach(function (card) {
        var photo = card.querySelector('.service-card__photo');
        var heart = card.querySelector('.service-card__heart');
        if (photo && heart && heart.parentNode !== photo) {
          photo.appendChild(heart);
        }
      });
    }

    function bindHearts() {
      document.querySelectorAll('#resultsGrid .service-card__heart').forEach(function (btn) {
        if (btn.dataset.bound === '1') return;
        btn.dataset.bound = '1';
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          e.preventDefault();
          handleHeartClick(btn);
        });
      });
    }

    function styleHeartBtn(btn, active) {
      var icon = btn.querySelector('i') || btn.querySelector('svg');
      var wasActive = btn.classList.contains('is-favorite');
      if (active) {
        btn.classList.add('is-favorite');
        btn.setAttribute('aria-pressed', 'true');
        if (icon) {
          icon.style.color = 'var(--rouge-500)';
          icon.style.fill = 'var(--rouge-500)';
          icon.setAttribute('fill', '#EE3F7E');
          icon.style.stroke = '#EE3F7E';
        }
        // Pulse-animasjon kun ved overgang tom → favoritt (ikke ved første render).
        if (!wasActive) {
          btn.classList.add('is-pulsing');
          setTimeout(function () { btn.classList.remove('is-pulsing'); }, 450);
        }
      } else {
        btn.classList.remove('is-favorite');
        btn.classList.remove('is-pulsing');
        btn.setAttribute('aria-pressed', 'false');
        if (icon) {
          icon.style.color = '';
          icon.style.fill = '';
          icon.removeAttribute('fill');
          icon.style.stroke = '';
        }
      }
    }

    async function handleHeartClick(btn) {
      var salonId = parseInt(btn.dataset.salonId, 10);
      var slug = btn.getAttribute('data-fav') || '';
      var loggedIn = window.NailedAuth && NailedAuth.isLoggedIn();

      if (loggedIn && Number.isFinite(salonId)) {
        var isFav = FAV_SET.has(salonId);
        if (isFav) FAV_SET.delete(salonId); else FAV_SET.add(salonId);
        styleHeartBtn(btn, !isFav);
        try {
          var res;
          if (isFav) {
            res = await NailedAuth.api('/api/v1/favorites/' + salonId, { method: 'DELETE' });
          } else {
            res = await NailedAuth.api('/api/v1/favorites', { method: 'POST', body: { salon_id: salonId } });
          }
          if (!res || !res.ok) throw new Error('fav api failed');
        } catch (err) {
          if (isFav) FAV_SET.add(salonId); else FAV_SET.delete(salonId);
          styleHeartBtn(btn, isFav);
        }
        return;
      }

      if (slug && typeof toggleFavorite === 'function') {
        var nowFav = toggleFavorite(slug);
        styleHeartBtn(btn, nowFav);
        if (typeof updateNavHeart === 'function') updateNavHeart();
      }
    }

    function setState(message) {
      var el = document.getElementById('resultsState');
      if (!el) return;
      if (!message) {
        el.style.display = 'none';
        el.textContent = '';
      } else {
        el.style.display = '';
        el.textContent = message;
      }
    }

    // Skeleton-kort vises mens fetch pågår. Render 6 stk + skjul «Laster…»-
    // teksten — bedre opplevelse enn tom skjerm med liten tekst.
    function renderSkeleton(n) {
      var grid = document.getElementById('resultsGrid');
      if (!grid) return;
      var state = document.getElementById('resultsState');
      if (state) state.style.display = 'none';
      // Fjern eksisterende kort først
      grid.querySelectorAll('.service-card').forEach(function (c) { c.remove(); });
      var html = '';
      for (var i = 0; i < n; i++) {
        html += '<article class="service-card service-card--skeleton">'
              +   '<div class="service-card__photo"></div>'
              +   '<div class="service-card__body sc2-body">'
              +     '<div class="sk-bar sk-bar--pill"></div>'
              +     '<div class="sk-bar sk-bar--title"></div>'
              +     '<div class="sk-bar sk-bar--meta"></div>'
              +   '</div>'
              + '</article>';
      }
      grid.insertAdjacentHTML('beforeend', html);
    }

    function fylkeLabelForHead() {
      if (currentFylke === 'all') return 'Norge';
      if (currentCity) return currentCity;
      var pill = document.querySelector('#fylkeRow [data-fylke="' + currentFylke + '"]');
      return pill ? pill.textContent.trim() : currentFylke;
    }

    function filterResults() {
      var cards = document.querySelectorAll('#resultsGrid .service-card');
      var count = 0;
      cards.forEach(function(card) {
        var show = true;
        if (currentFylke !== 'all') {
          if (card.dataset.fylke && card.dataset.fylke !== currentFylke) show = false;
        }
        if (currentCity && card.dataset.city !== currentCity) show = false;
        if (currentTx !== 'all' && card.dataset.tx && card.dataset.tx.indexOf(currentTx) < 0) show = false;
        if (activeQuick.indexOf('today') >= 0 && card.dataset.slot && !card.dataset.slot.startsWith('I dag')) show = false;
        if (activeQuick.indexOf('topRated') >= 0 && card.dataset.rating && parseFloat(card.dataset.rating) < 4.8) show = false;
        if (activeQuick.indexOf('budget') >= 0 && card.dataset.price && parseInt(card.dataset.price) >= 800) show = false;
        if (activeQuick.indexOf('new') >= 0 && card.dataset.new !== 'true') show = false;
        if (activeQuick.indexOf('popular') >= 0 && card.dataset.reviews && parseInt(card.dataset.reviews) < 200) show = false;
        card.style.display = show ? '' : 'none';
        if (show) count++;
      });
      var head = document.getElementById('resultsHeadCount');
      if (head) {
        var label = escapeHtml(fylkeLabelForHead());
        // Vis «X av Y behandlere i …» når vi har en total fra backend
        // (mange behandlere paginert). Når visnet = total, viser vi bare ett tall.
        if (totalSalons > count) {
          head.innerHTML = '<strong>' + count + '</strong> av <strong>' + totalSalons + '</strong> behandlere i ' + label;
        } else {
          head.innerHTML = '<strong>' + count + '</strong> behandlere i ' + label;
        }
      }
      var noCards = cards.length === 0;
      var noMatches = count === 0;
      if (noCards || noMatches) {
        if (currentQ) {
          setState('Ingen treff for «' + currentQ + '»');
        } else if (currentCity) {
          setState('Ingen behandlere i ' + currentCity);
        } else if (noCards) {
          setState('Ingen behandlere funnet');
        } else {
          setState('Ingen behandlere matcher filtrene dine');
        }
      } else {
        setState('');
      }
      lucide.createIcons();
    }

    var PAGE_SIZE = 24;
    var currentPage = 1;   // 1-indeksert
    var totalSalons = 0;

    async function loadSalons(keepPage) {
      // Default: reset til side 1 ved filter/søk-endringer. Paginerings-
      // klikk passerer keepPage=true så vi blir på riktig side.
      if (!keepPage) currentPage = 1;
      renderSkeleton(6);
      var offset = (currentPage - 1) * PAGE_SIZE;
      var qs = ['limit=' + PAGE_SIZE, 'offset=' + offset];
      if (currentQ) qs.push('q=' + encodeURIComponent(currentQ));
      if (currentCity) qs.push('city=' + encodeURIComponent(currentCity));
      if (fState.min_price != null) qs.push('min_price=' + fState.min_price);
      if (fState.max_price != null) qs.push('max_price=' + fState.max_price);
      if (fState.max_duration != null) qs.push('max_duration=' + fState.max_duration);
      if (fState.category) qs.push('category=' + encodeURIComponent(fState.category));
      if (fState.min_rating != null) qs.push('min_rating=' + fState.min_rating);
      if (fState.open_now) qs.push('open_now=1');
      if (fState.has_reviews) qs.push('has_reviews=1');
      try {
        var res = await fetch('/api/v1/salons?' + qs.join('&'), { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('Status ' + res.status);
        var data = await res.json();
        ALL_SALONS = Array.isArray(data.salons) ? data.salons : [];
        totalSalons = Number(data.total != null ? data.total : ALL_SALONS.length);
      } catch (err) {
        // Tøm DOM-cards så bruker ikke ser stale resultater fra forrige
        // filterstate samtidig som «Kunne ikke laste»-melding vises.
        ALL_SALONS = [];
        var gridErr = document.getElementById('resultsGrid');
        if (gridErr) gridErr.querySelectorAll('.service-card').forEach(function (c) { c.parentNode.removeChild(c); });
        var headErr = document.getElementById('resultsHeadCount');
        if (headErr) headErr.textContent = '';
        setState('Kunne ikke laste behandlere. Prøv igjen senere.');
        return;
      }

      if (window.NailedAuth && NailedAuth.isLoggedIn()) {
        try {
          var favRes = await NailedAuth.api('/api/v1/favorites');
          if (favRes && favRes.ok) {
            var favData = await favRes.json();
            FAV_SET = new Set((favData.favorites || []).map(function (f) { return f.id; }));
          }
        } catch (_) { /* ignore */ }
      }

      refreshCategoryOptions();
      renderResults();
      renderPagination();
    }

    function renderPagination() {
      var nav = document.getElementById('utforskPagination');
      if (!nav) return;
      var totalPages = Math.max(1, Math.ceil(totalSalons / PAGE_SIZE));
      if (totalPages <= 1) { nav.hidden = true; nav.innerHTML = ''; return; }
      nav.hidden = false;
      var html = '';
      // Forrige
      html += '<button class="utforsk-pagination__btn" type="button" data-page="' + (currentPage - 1) + '"' +
        (currentPage <= 1 ? ' disabled' : '') + ' aria-label="Forrige side">‹</button>';
      // Sidetallene: vis 1, 2, … , gjeldende-1, gjeldende, gjeldende+1, …, sist
      var pages = [];
      function push(n) { if (pages.indexOf(n) === -1) pages.push(n); }
      push(1);
      for (var p = Math.max(2, currentPage - 1); p <= Math.min(totalPages - 1, currentPage + 1); p++) push(p);
      if (totalPages > 1) push(totalPages);
      pages.sort(function (a, b) { return a - b; });
      var prev = 0;
      pages.forEach(function (n) {
        if (n - prev > 1) html += '<span class="utforsk-pagination__ellipsis">…</span>';
        html += '<button class="utforsk-pagination__btn' + (n === currentPage ? ' is-active' : '') + '"' +
                ' type="button" data-page="' + n + '" aria-label="Side ' + n + '"' +
                (n === currentPage ? ' aria-current="page"' : '') + '>' + n + '</button>';
        prev = n;
      });
      // Neste
      html += '<button class="utforsk-pagination__btn" type="button" data-page="' + (currentPage + 1) + '"' +
        (currentPage >= totalPages ? ' disabled' : '') + ' aria-label="Neste side">›</button>';
      nav.innerHTML = html;
      nav.querySelectorAll('[data-page]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var p = parseInt(this.getAttribute('data-page'), 10);
          if (!p || p < 1 || p > totalPages || p === currentPage) return;
          currentPage = p;
          loadSalons(true); // keepPage = true så vi ikke resetter til 1
          var grid = document.getElementById('resultsGrid');
          if (grid) grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    function refreshCategoryOptions() {
      var sel = document.getElementById('fCategory');
      if (!sel) return;
      var set = new Set();
      ALL_SALONS.forEach(function (s) {
        (s.top_categories || []).forEach(function (n) { if (n) set.add(n); });
      });
      var names = Array.from(set).sort(function (a, b) { return a.localeCompare(b, 'nb'); });
      var existing = fState.category;
      var html = '<option value="">Alle kategorier</option>';
      names.forEach(function (n) {
        html += '<option value="' + escapeHtml(n) + '"' + (n === existing ? ' selected' : '') + '>' + escapeHtml(n) + '</option>';
      });
      if (existing && !set.has(existing)) {
        html += '<option value="' + escapeHtml(existing) + '" selected>' + escapeHtml(existing) + '</option>';
      }
      sel.innerHTML = html;
    }

    function renderActiveChips() {
      var slot = document.getElementById('activeFilters');
      if (!slot) return;
      slot.innerHTML = '';

      function addChip(label, onRemove) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip active';
        chip.innerHTML = escapeHtml(label) + ' <span style="margin-left:4px; font-weight:600;">✕</span>';
        chip.addEventListener('click', function () {
          onRemove();
          syncUrl();
          syncFilterInputs();
          refreshFilterBtnBadge();
          renderActiveChips();
          loadSalons();
        });
        slot.appendChild(chip);
      }

      if (currentQ) {
        addChip('Søker etter: «' + currentQ + '»', function () { currentQ = ''; });
      }
      if (fState.open_now) {
        addChip('Åpent nå', function () { fState.open_now = false; });
      }
      if (fState.has_reviews) {
        addChip('Har anmeldelser', function () { fState.has_reviews = false; });
      }
      if (fState.min_price != null) {
        addChip('Fra ' + fState.min_price + ' kr', function () { fState.min_price = null; });
      }
      if (fState.max_price != null) {
        addChip('Maks ' + fState.max_price + ' kr', function () { fState.max_price = null; });
      }
      if (fState.max_duration != null) {
        addChip('Maks ' + fState.max_duration + ' min', function () { fState.max_duration = null; });
      }
      if (fState.category) {
        addChip(fState.category, function () { fState.category = ''; });
      }
      if (fState.min_rating != null) {
        addChip('★ ' + fState.min_rating + '+', function () { fState.min_rating = null; });
      }
    }

    function syncFilterInputs() {
      document.getElementById('fMinPrice').value = fState.min_price != null ? fState.min_price : '';
      document.getElementById('fMaxPrice').value = fState.max_price != null ? fState.max_price : '';
      document.getElementById('fMaxDuration').value = fState.max_duration != null ? String(fState.max_duration) : '';
      document.getElementById('fCategory').value = fState.category || '';
      var openInput = document.getElementById('fOpenNow');
      openInput.checked = !!fState.open_now;
      var openRow = document.getElementById('fOpenNowRow');
      openRow.classList.toggle('is-checked', !!fState.open_now);
      openRow.setAttribute('aria-pressed', fState.open_now ? 'true' : 'false');
      var revInput = document.getElementById('fHasReviews');
      revInput.checked = !!fState.has_reviews;
      var revRow = document.getElementById('fHasReviewsRow');
      revRow.classList.toggle('is-checked', !!fState.has_reviews);
      revRow.setAttribute('aria-pressed', fState.has_reviews ? 'true' : 'false');
      var stars = document.querySelectorAll('#fRatingStars button');
      stars.forEach(function (b) {
        var v = parseInt(b.dataset.r, 10);
        b.classList.toggle('is-on', fState.min_rating != null && v <= fState.min_rating);
      });
    }

    // --- Star selector --------------------------------------------------------
    var ratingStarsEl = document.getElementById('fRatingStars');
    if (ratingStarsEl) {
      ratingStarsEl.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-r]');
        if (!btn) return;
        var v = parseInt(btn.dataset.r, 10);
        if (fState.min_rating === v) {
          fState.min_rating = null;
        } else {
          fState.min_rating = v;
        }
        syncFilterInputs();
        syncUrl();
        refreshFilterBtnBadge();
        renderActiveChips();
        loadSalons();
      });
    }

    // --- Apply / Reset --------------------------------------------------------
    document.getElementById('filterApply').addEventListener('click', function () {
      readPanelIntoState();
      syncUrl();
      syncFilterInputs();
      refreshFilterBtnBadge();
      renderActiveChips();
      loadSalons();
      closeDrawer();
    });

    document.getElementById('filterReset').addEventListener('click', function () {
      fState.min_price = null;
      fState.max_price = null;
      fState.max_duration = null;
      fState.category = '';
      fState.min_rating = null;
      fState.open_now = false;
      fState.has_reviews = false;
      currentQ = '';
      currentFylke = 'all';
      currentCity = null;
      currentTx = 'all';
      activeQuick = [];
      // Rydd Sted-søk-inputen så bruker ikke ser «Halden» igjen etter Nullstill.
      var stedInput = document.getElementById('stedSearch');
      var stedClear = document.getElementById('stedSearchClear');
      if (stedInput) {
        stedInput.value = '';
        if (stedInput._nailedPlaces && stedInput._nailedPlaces.setValue) stedInput._nailedPlaces.setValue('');
      }
      if (stedClear) stedClear.hidden = true;
      // Reset visual state of pill rows
      document.querySelectorAll('#fylkeRow .v-pill').forEach(function (p) { p.classList.remove('active'); });
      var allFylke = document.querySelector('#fylkeRow [data-fylke="all"]');
      if (allFylke) allFylke.classList.add('active');
      document.querySelectorAll('#treatmentRow .v-pill').forEach(function (p) { p.classList.remove('active'); });
      var allTx = document.querySelector('#treatmentRow [data-tx="all"]');
      if (allTx) allTx.classList.add('active');
      document.querySelectorAll('#quickRow .check-row').forEach(function (r) { r.classList.remove('is-checked'); });
      renderCities();
      updateStedLabel();
      syncUrl();
      syncFilterInputs();
      refreshFilterBtnBadge();
      renderActiveChips();
      loadSalons();
    });

    // --- Mobile drawer wiring -------------------------------------------------
    // Filter-knappen er nå i hero-en (filterBtnHero), ikke i den fjernede
    // mobile-filter-baren. Beholder filterBtn-variabelen så øvrig kode kan
    // bruke samme referanse.
    var filterBtn = document.getElementById('filterBtnHero');
    var filterSidebar = document.getElementById('filterSidebar');
    var filterBackdrop = document.getElementById('filterBackdrop');
    var filterClose = document.getElementById('filterClose');

    function openDrawer() {
      filterSidebar.classList.add('is-open');
      filterBackdrop.classList.add('is-open');
      if (filterBtn) filterBtn.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }
    function closeDrawer() {
      filterSidebar.classList.remove('is-open');
      filterBackdrop.classList.remove('is-open');
      if (filterBtn) filterBtn.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }
    if (filterBtn) filterBtn.addEventListener('click', openDrawer);
    if (filterClose) filterClose.addEventListener('click', closeDrawer);
    if (filterBackdrop) filterBackdrop.addEventListener('click', closeDrawer);

    // --- Sortering ------------------------------------------------------------
    // Kun én sort-dropdown nå (mobile-filter-baren ble fjernet).
    var sortDesktop = document.getElementById('sortSelect');
    async function applySort() {
      if (!ALL_SALONS.length) return;
      var mode = (sortDesktop && sortDesktop.value) || 'relevant';
      if (mode === 'relevant' && !userGeo) {
        await requestGeo();
      }
      renderResults();
    }
    if (sortDesktop) sortDesktop.addEventListener('change', applySort);
    // Be om posisjon i bakgrunn ved sidelast så «Mest relevant» (default)
    // får full effekt med en gang dataene er lastet.
    requestGeo().then(function () { if (ALL_SALONS.length) renderResults(); });

    // --- Initial application of URL-derived state ----------------------------
    (function applyInitialFylkePill() {
      if (currentFylke === 'all') return;
      var pill = document.querySelector('#fylkeRow [data-fylke="' + currentFylke + '"]');
      if (!pill) return;
      document.querySelectorAll('#fylkeRow .v-pill').forEach(function (p) { p.classList.remove('active'); });
      pill.classList.add('active');
    })();
    renderCities();
    updateStedLabel();
    syncFilterInputs();
    refreshFilterBtnBadge();
    renderActiveChips();

    // Auto-expand the Sted accordion when arriving with a fylke/city preset.
    // Guarder mot null — stedAccordion-elementet kan være fjernet i et tidligere
    // designpass. Uten denne guarden kaster TypeError og loadSalons() kjøres aldri.
    if ((currentFylke !== 'all' || currentCity) && stedAccordion) {
      stedAccordion.classList.add('is-open');
      if (stedTrigger) stedTrigger.setAttribute('aria-expanded', 'true');
    }

    loadSalons();
  </script>
</body>
