<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nailed — utforsk</title>
  <link rel="icon" href="assets/logo-mark.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Top navigation -->
  <header class="top-nav" id="topNav">
    <div class="page top-nav__inner">
      <a class="top-nav__brand" href="index.html">
        <img src="assets/logo-wordmark.svg" alt="nailed" />
      </a>
      <nav class="top-nav__links">
        <a href="utforsk.html">Utforsk</a>
        <a href="for-salonger.html">For salonger</a>
        <a href="last-ned-app.html">Last ned app</a>
      </nav>
      <div class="top-nav__actions">
        <a href="favoritter.html" class="btn-icon"><i data-lucide="heart"></i></a>
        <a href="login.html" class="btn btn-ghost btn-sm">Logg inn</a>
      </div>
    </div>
  </header>

  <!-- Hero title -->
  <section class="utforsk-hero">
    <div class="page">
      <h1 class="utforsk-hero__title">Utforsk <em>Norge</em></h1>
    </div>
  </section>

  <!-- Filters -->
  <section class="page" style="padding-top: 8px;">

    <!-- Fylke row -->
    <div class="filter-row" id="fylkeRow">
      <span class="filter-row__label">Fylke</span>
      <button class="pill active" data-fylke="all">Hele Norge</button>
      <button class="pill" data-fylke="oslo">Oslo</button>
      <button class="pill" data-fylke="akershus">Akershus</button>
      <button class="pill" data-fylke="vestland">Vestland</button>
      <button class="pill" data-fylke="rogaland">Rogaland</button>
      <button class="pill" data-fylke="trondelag">Trøndelag</button>
      <button class="pill" data-fylke="innlandet">Innlandet</button>
      <button class="pill" data-fylke="ostfold">Østfold</button>
      <button class="pill" data-fylke="agder">Agder</button>
      <button class="pill" data-fylke="buskerud">Buskerud</button>
      <button class="pill" data-fylke="mr">Møre og Romsdal</button>
      <button class="pill" data-fylke="vestfold">Vestfold</button>
      <button class="pill" data-fylke="nordland">Nordland</button>
      <button class="pill" data-fylke="telemark">Telemark</button>
      <button class="pill" data-fylke="troms">Troms</button>
      <button class="pill" data-fylke="finnmark">Finnmark</button>
    </div>

    <!-- City/bydel row (shown when fylke selected) -->
    <div class="filter-row" id="cityRow" style="padding-top: 0; display: none;">
      <span class="filter-row__label">By/bydel</span>
      <div class="cities-row" id="citiesInner"></div>
    </div>

    <div class="filter-divider"></div>

    <!-- Behandling -->
    <div class="filter-row" id="treatmentRow">
      <span class="filter-row__label">Behandling</span>
      <button class="pill active" data-tx="all"><i data-lucide="layout-grid"></i> Alt</button>
      <button class="pill" data-tx="nails"><i data-lucide="sparkles"></i> Negler</button>
      <button class="pill" data-tx="lashes"><i data-lucide="eye"></i> Vipper</button>
      <button class="pill" data-tx="brows">Bryn</button>
      <button class="pill" data-tx="makeup"><i data-lucide="palette"></i> Makeup</button>
      <button class="pill" data-tx="hair"><i data-lucide="scissors"></i> Hår</button>
      <button class="pill" data-tx="wax">Voksing</button>
      <button class="pill" data-tx="tan">Spraytan</button>
      <button class="pill" data-tx="massage">Massasje</button>
    </div>

    <!-- Snarveier -->
    <div class="filter-row" id="quickRow">
      <span class="filter-row__label">Snarveier</span>
      <button class="pill pill--accent active" data-quick="today"><i data-lucide="zap"></i> Tilgjengelig i dag</button>
      <button class="pill pill--accent" data-quick="tomorrow"><i data-lucide="calendar-clock"></i> Ledig i morgen</button>
      <button class="pill pill--accent" data-quick="popular"><i data-lucide="flame"></i> Mest populære</button>
      <button class="pill pill--accent" data-quick="new"><i data-lucide="sparkle"></i> Nye på nailed</button>
      <button class="pill pill--accent" data-quick="topRated"><i data-lucide="star"></i> Topp vurdert</button>
      <button class="pill pill--accent" data-quick="budget"><i data-lucide="banknote"></i> Under 800 kr</button>
      <button class="pill pill--accent" data-quick="home"><i data-lucide="home"></i> Hjemmebesøk</button>
      <button class="pill pill--accent" data-quick="evening"><i data-lucide="moon"></i> Åpent på kveld</button>
    </div>
  </section>

  <!-- Toolbar + results -->
  <section class="utforsk-body">
    <div class="page">
      <div class="utforsk-toolbar">
        <div class="utforsk-toolbar__active" id="activeFilters"></div>
        <div class="utforsk-toolbar__sort">
          <i data-lucide="arrow-up-down" style="width: 14px; height: 14px;"></i>
          Sortér:
          <select id="sortSelect">
            <option value="next">Neste ledige time</option>
            <option value="price">Lavest pris</option>
            <option value="rating">Best vurdert</option>
          </select>
        </div>
      </div>

      <div class="utforsk-results--3col" id="resultsGrid">
        <div class="utforsk-results-head" id="resultsHead">
          <span id="resultsHeadCount">Laster salonger…</span>
          <span style="display:inline-flex; align-items:center; gap:6px;">
            <i data-lucide="zap" style="width:14px; height:14px; color:var(--rouge-500);"></i>
            Oppdatert nå
          </span>
        </div>
        <div id="resultsState" style="grid-column: 1 / -1; padding: 48px 16px; text-align: center; color: var(--fg-muted); font-size: 14px;"></div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="page footer__inner">
      <div class="footer__top">
        <img src="assets/logo-wordmark.svg" alt="nailed" class="footer__brand" />
        <div class="footer__socials">
          <a class="footer__social" href="#" aria-label="Instagram"><i data-lucide="instagram"></i></a>
          <a class="footer__social" href="#" aria-label="TikTok"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 00-.79-.05A6.34 6.34 0 003.15 15.2a6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.34-6.34V9.17a8.16 8.16 0 004.76 1.51v-3.45a4.85 4.85 0 01-1-.54z"/></svg></a>
          <a class="footer__social" href="#" aria-label="Facebook"><i data-lucide="facebook"></i></a>
        </div>
      </div>
      <div class="footer__links">
        <a href="utforsk.html">Utforsk</a>
        <a href="for-salonger.html">For salonger</a>
        <a href="last-ned-app.html">Last ned app</a>
        <a href="/personvern.html">Personvern</a>
        <a href="/vilkar.html">Bruksvilkår</a>
        <a href="/cookies.html">Cookies</a>
        <a href="#">FAQ</a>
        <a href="#">Kontakt oss</a>
        <a href="#">Om oss</a>
      </div>
      <div class="footer__bottom">
        <small>&copy; 2026 Neglet AS &middot; Made in Oslo</small>
        <div class="footer__badges">
          <span class="footer__badge"><i data-lucide="smartphone" style="width:12px;height:12px;"></i> App Store — juni</span>
          <span class="footer__badge"><i data-lucide="smartphone" style="width:12px;height:12px;"></i> Google Play — juli</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/assets/auth.js"></script>
  <script src="favorites.js"></script>
  <script defer src="/assets/cookie-banner.js"></script>
  <script>
    lucide.createIcons();

    // Nav scroll
    var nav = document.getElementById('topNav');
    window.addEventListener('scroll', function() { nav.classList.toggle('scrolled', window.scrollY > 30); });

    // City data — used by city sub-row UI
    var CITIES = {
      oslo: ['Sentrum','Grünerløkka','Frogner','Majorstuen','Sagene','St. Hanshaugen','Tøyen','Bislett','Bjørvika','Grønland'],
      akershus: ['Bærum','Asker','Lillestrøm','Ullensaker','Nordre Follo','Nesodden'],
      vestland: ['Bergen','Voss','Førde','Sogndal','Askøy','Os'],
      rogaland: ['Stavanger','Sandnes','Haugesund','Bryne','Egersund'],
      trondelag: ['Trondheim','Stjørdal','Steinkjer','Levanger','Namsos'],
      innlandet: ['Hamar','Lillehammer','Gjøvik','Elverum'],
      ostfold: ['Fredrikstad','Sarpsborg','Moss','Halden','Askim'],
      agder: ['Kristiansand','Arendal','Mandal','Grimstad'],
      buskerud: ['Drammen','Kongsberg','Ringerike','Hønefoss'],
      mr: ['Ålesund','Molde','Kristiansund','Ulsteinvik'],
      vestfold: ['Tønsberg','Sandefjord','Larvik','Horten'],
      nordland: ['Bodø','Mo i Rana','Narvik','Svolvær'],
      telemark: ['Skien','Porsgrunn','Notodden','Bø'],
      troms: ['Tromsø','Harstad','Finnsnes'],
      finnmark: ['Alta','Hammerfest','Kirkenes','Vadsø']
    };

    // Reverse lookup: city name -> fylke key (so we can set data-fylke from API city).
    var CITY_TO_FYLKE = {};
    Object.keys(CITIES).forEach(function (k) {
      CITIES[k].forEach(function (city) { CITY_TO_FYLKE[city.toLowerCase()] = k; });
    });

    // Gradient palette for fallback when no cover image is available.
    var FALLBACK_GRADIENTS = [
      'linear-gradient(135deg, #FFE0E9, #FFC4D6)',
      'linear-gradient(135deg, #F4ECDF, #E8DCC4)',
      'linear-gradient(135deg, #FFF1F5, #FB6B9A)',
      'linear-gradient(135deg, #DDE3D2, #8DA079)',
      'linear-gradient(135deg, #FFC4D6, #82103D)',
      'linear-gradient(135deg, #ECDFCB, #C9B79A)',
      'linear-gradient(135deg, #F4ECDF, #B89870)',
      'linear-gradient(135deg, #FFE0E9, #B8536F)',
      'linear-gradient(135deg, #DDE3D2, #7B8E68)',
      'linear-gradient(135deg, #ECDFCB, #82103D)'
    ];

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function gradientFor(id) {
      var n = (typeof id === 'number' ? id : 0);
      return FALLBACK_GRADIENTS[Math.abs(n) % FALLBACK_GRADIENTS.length];
    }

    function fylkeForCity(city) {
      if (!city) return '';
      var k = CITY_TO_FYLKE[String(city).toLowerCase()];
      return k || '';
    }

    var currentFylke = 'all';
    var currentCity = null;
    var currentTx = 'all';
    var activeQuick = []; // start empty: API doesn't provide slot/rating/price yet

    var ALL_SALONS = []; // raw API rows
    var FAV_SET = new Set(); // server favorite salon IDs (numbers) when logged in

    // Fylke selection
    document.getElementById('fylkeRow').addEventListener('click', function(e) {
      var pill = e.target.closest('[data-fylke]');
      if (!pill) return;
      currentFylke = pill.dataset.fylke;
      currentCity = null;
      document.querySelectorAll('#fylkeRow .pill').forEach(function(p) { p.classList.remove('active'); });
      pill.classList.add('active');
      renderCities();
      filterResults();
    });

    // Treatment selection
    document.getElementById('treatmentRow').addEventListener('click', function(e) {
      var pill = e.target.closest('[data-tx]');
      if (!pill) return;
      currentTx = pill.dataset.tx;
      document.querySelectorAll('#treatmentRow .pill').forEach(function(p) { p.classList.remove('active'); });
      pill.classList.add('active');
      filterResults();
    });

    // Quick filter (multi-select). Default all off until we have the data.
    document.querySelectorAll('#quickRow .pill.active').forEach(function (p) { p.classList.remove('active'); });
    document.getElementById('quickRow').addEventListener('click', function(e) {
      var pill = e.target.closest('[data-quick]');
      if (!pill) return;
      var id = pill.dataset.quick;
      var idx = activeQuick.indexOf(id);
      if (idx >= 0) { activeQuick.splice(idx, 1); pill.classList.remove('active'); }
      else { activeQuick.push(id); pill.classList.add('active'); }
      filterResults();
    });

    function renderCities() {
      var cityRow = document.getElementById('cityRow');
      var inner = document.getElementById('citiesInner');
      if (currentFylke === 'all' || !CITIES[currentFylke]) {
        cityRow.style.display = 'none';
        return;
      }
      cityRow.style.display = '';
      var html = '<button class="pill active" data-city="">Alle byer</button>';
      CITIES[currentFylke].forEach(function(c) {
        html += '<button class="pill" data-city="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>';
      });
      inner.innerHTML = html;
      lucide.createIcons();
    }

    // Delegate city pill clicks (cityRow is rebuilt on fylke change).
    document.getElementById('citiesInner').addEventListener('click', function(e) {
      var pill = e.target.closest('[data-city]');
      if (!pill) return;
      currentCity = pill.dataset.city || null;
      this.querySelectorAll('.pill').forEach(function(p) { p.classList.remove('active'); });
      pill.classList.add('active');
      filterResults();
    });

    function buildCard(salon) {
      var fylke = fylkeForCity(salon.city);
      var fylkeAttr = fylke || '';
      var cityAttr = salon.city || '';
      var photoStyle;
      if (salon.cover_url) {
        photoStyle = "background-image: url('" + encodeURI(salon.cover_url) + "'); background-size: cover; background-position: center;";
      } else {
        photoStyle = 'background: ' + gradientFor(salon.id) + ';';
      }

      var isFav = FAV_SET.has(salon.id);
      var heartClass = 'service-card__heart' + (isFav ? ' is-favorite' : '');
      var heartFillStyle = isFav
        ? 'color:var(--rouge-500);fill:var(--rouge-500);'
        : '';

      var slug = encodeURIComponent(salon.slug || '');
      var locationLine = '';
      if (salon.city) {
        locationLine = '<div class="service-card__meta"><i data-lucide="map-pin"></i>' + escapeHtml(salon.city) + '</div>';
      }

      return ''
        + '<article class="service-card card" '
          + 'data-fylke="' + escapeHtml(fylkeAttr) + '" '
          + 'data-city="' + escapeHtml(cityAttr) + '" '
          + 'data-tx="" data-price="" data-rating="" data-reviews="" data-slot="" '
          + 'onclick="location.href=\'salon.html?slug=' + slug + '\'">'
          + '<div class="service-card__photo" style="' + photoStyle + '">'
            + '<button class="' + heartClass + '" data-fav="' + escapeHtml(salon.slug || '') + '" data-salon-id="' + salon.id + '" aria-pressed="' + (isFav ? 'true' : 'false') + '">'
              + '<i data-lucide="heart" style="' + heartFillStyle + '"></i>'
            + '</button>'
          + '</div>'
          + '<div class="service-card__body">'
            + '<div class="service-card__row">'
              + '<div>'
                + '<div class="service-card__name">' + escapeHtml(salon.name || 'Salong') + '</div>'
                + locationLine
              + '</div>'
            + '</div>'
          + '</div>'
        + '</article>';
    }

    function renderResults() {
      var grid = document.getElementById('resultsGrid');
      // Remove any existing cards (keep head + state node).
      var oldCards = grid.querySelectorAll('.service-card');
      oldCards.forEach(function (c) { c.parentNode.removeChild(c); });

      var html = ALL_SALONS.map(buildCard).join('');
      var stateEl = document.getElementById('resultsState');
      stateEl.insertAdjacentHTML('beforebegin', html);
      lucide.createIcons();
      bindHearts();
      filterResults();
    }

    function bindHearts() {
      document.querySelectorAll('#resultsGrid .service-card__heart').forEach(function (btn) {
        // Avoid re-binding (we replace cards on render anyway, but be safe).
        if (btn.dataset.bound === '1') return;
        btn.dataset.bound = '1';
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          e.preventDefault();
          handleHeartClick(btn);
        });
      });
    }

    function styleHeartBtn(btn, active) {
      var icon = btn.querySelector('i') || btn.querySelector('svg');
      if (active) {
        btn.classList.add('is-favorite');
        btn.setAttribute('aria-pressed', 'true');
        if (icon) {
          icon.style.color = 'var(--rouge-500)';
          icon.style.fill = 'var(--rouge-500)';
          icon.setAttribute('fill', '#EE3F7E');
          icon.style.stroke = '#EE3F7E';
        }
      } else {
        btn.classList.remove('is-favorite');
        btn.setAttribute('aria-pressed', 'false');
        if (icon) {
          icon.style.color = '';
          icon.style.fill = '';
          icon.removeAttribute('fill');
          icon.style.stroke = '';
        }
      }
    }

    async function handleHeartClick(btn) {
      var salonId = parseInt(btn.dataset.salonId, 10);
      var slug = btn.getAttribute('data-fav') || '';
      var loggedIn = window.NailedAuth && NailedAuth.isLoggedIn();

      if (loggedIn && Number.isFinite(salonId)) {
        var isFav = FAV_SET.has(salonId);
        // Optimistic UI
        if (isFav) FAV_SET.delete(salonId); else FAV_SET.add(salonId);
        styleHeartBtn(btn, !isFav);
        try {
          var res;
          if (isFav) {
            res = await NailedAuth.api('/api/v1/favorites/' + salonId, { method: 'DELETE' });
          } else {
            res = await NailedAuth.api('/api/v1/favorites', { method: 'POST', body: { salon_id: salonId } });
          }
          if (!res || !res.ok) throw new Error('fav api failed');
        } catch (err) {
          // Revert
          if (isFav) FAV_SET.add(salonId); else FAV_SET.delete(salonId);
          styleHeartBtn(btn, isFav);
        }
        return;
      }

      // Anonymous: fall back to cookie-based favorites by slug.
      if (slug && typeof toggleFavorite === 'function') {
        var nowFav = toggleFavorite(slug);
        styleHeartBtn(btn, nowFav);
        if (typeof updateNavHeart === 'function') updateNavHeart();
      }
    }

    function setState(message) {
      var el = document.getElementById('resultsState');
      if (!el) return;
      if (!message) {
        el.style.display = 'none';
        el.textContent = '';
      } else {
        el.style.display = '';
        el.textContent = message;
      }
    }

    function fylkeLabelForHead() {
      if (currentFylke === 'all') return 'hele Norge';
      if (currentCity) return currentCity;
      var pill = document.querySelector('#fylkeRow [data-fylke="' + currentFylke + '"]');
      return pill ? pill.textContent.trim() : currentFylke;
    }

    function filterResults() {
      var cards = document.querySelectorAll('#resultsGrid .service-card');
      var count = 0;
      cards.forEach(function(card) {
        var show = true;
        if (currentFylke !== 'all') {
          // If we don't know the salon's fylke, don't hide it on a fylke filter
          // — better to show it than to hide live data behind missing metadata.
          if (card.dataset.fylke && card.dataset.fylke !== currentFylke) show = false;
        }
        if (currentCity && card.dataset.city !== currentCity) show = false;
        if (currentTx !== 'all' && card.dataset.tx && card.dataset.tx.indexOf(currentTx) < 0) show = false;
        // Quick filters depend on data we don't have from the API yet.
        // Only apply when the data attribute is populated; otherwise skip.
        if (activeQuick.indexOf('today') >= 0 && card.dataset.slot && !card.dataset.slot.startsWith('I dag')) show = false;
        if (activeQuick.indexOf('topRated') >= 0 && card.dataset.rating && parseFloat(card.dataset.rating) < 4.8) show = false;
        if (activeQuick.indexOf('budget') >= 0 && card.dataset.price && parseInt(card.dataset.price) >= 800) show = false;
        if (activeQuick.indexOf('new') >= 0 && card.dataset.new !== 'true') show = false;
        if (activeQuick.indexOf('popular') >= 0 && card.dataset.reviews && parseInt(card.dataset.reviews) < 200) show = false;
        card.style.display = show ? '' : 'none';
        if (show) count++;
      });
      var head = document.getElementById('resultsHeadCount');
      if (head) {
        head.innerHTML = '<strong>' + count + '</strong> salonger i ' + escapeHtml(fylkeLabelForHead().toLowerCase());
      }
      // Empty state when no cards match (or when there are zero salons total).
      if (cards.length === 0) {
        setState('Ingen salonger funnet');
      } else if (count === 0) {
        setState('Ingen salonger matcher filtrene dine');
      } else {
        setState('');
      }
      lucide.createIcons();
    }

    async function loadSalons() {
      setState('Laster salonger…');
      try {
        var res = await fetch('/api/v1/salons?limit=24', { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('Status ' + res.status);
        var data = await res.json();
        ALL_SALONS = Array.isArray(data.salons) ? data.salons : [];
      } catch (err) {
        setState('Kunne ikke laste salonger. Prøv igjen senere.');
        return;
      }

      // If logged in, fetch favorites first so we can mark hearts on initial render.
      if (window.NailedAuth && NailedAuth.isLoggedIn()) {
        try {
          var favRes = await NailedAuth.api('/api/v1/favorites');
          if (favRes && favRes.ok) {
            var favData = await favRes.json();
            FAV_SET = new Set((favData.favorites || []).map(function (f) { return f.id; }));
          }
        } catch (_) { /* ignore — render hearts as not-favorited */ }
      }

      renderResults();
    }

    loadSalons();
  </script>
</body>
</html>
