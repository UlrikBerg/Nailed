<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Utforsk behandlere — nailed</title>
  <meta name="description" content="Bla gjennom behandlere i hele Norge. Filtrer på sted, behandling og tilgjengelighet. Negler, vipper, bryn, makeup og hår — verifiserte anmeldelser fra ekte kunder." />
  <meta name="theme-color" content="#EE3F7E" />
  <link rel="canonical" href="https://nailed.no/utforsk" />
  <link rel="icon" href="assets/logo-mark.svg" />
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#FBF6EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nailed">
  <link rel="stylesheet" href="styles.css" />
  <link rel="preload" as="image" href="assets/logo-wordmark.svg?v=6">

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="nailed" />
  <meta property="og:title" content="Utforsk behandlere — nailed" />
  <meta property="og:description" content="Filtrer behandlere på by, pris og behandling. Book time på nailed." />
  <meta property="og:url" content="https://nailed.no/utforsk" />
  <meta property="og:image" content="https://nailed.no/assets/logo-wordmark.svg?v=6" />
  <meta property="og:locale" content="nb_NO" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Utforsk behandlere — nailed" />
  <meta name="twitter:description" content="Filtrer behandlere på by, pris og behandling. Book time på nailed." />
  <meta name="twitter:image" content="https://nailed.no/assets/logo-wordmark.svg?v=6" />
  <style>
    /* Hero — kept tight so the two-column body lands above the fold. */
    .utforsk-hero { padding: 28px 0 8px; }
    .utforsk-hero__inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .utforsk-hero__title { font-size: clamp(28px, 4.5vw, 48px); margin: 0; }
    /* Filter-knappen i hero — kun synlig på mobil. På desktop ligger filtrene
       i sidebar-en til venstre. */
    .utforsk-hero__filter-btn {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--cream-50);
      border: 1px solid var(--stone-200);
      border-radius: var(--radius-pill);
      padding: 10px 18px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      color: var(--ink);
      cursor: pointer;
      min-height: 40px;
      transition: border-color var(--dur-fast);
    }
    .utforsk-hero__filter-btn:hover { border-color: var(--stone-400); }
    .utforsk-hero__filter-btn i { width: 16px; height: 16px; }
    .utforsk-hero__filter-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--rouge-500);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }
    @media (max-width: 1024px) {
      .utforsk-hero__filter-btn { display: inline-flex; }
    }

    /* =========================================================================
       Two-column layout — Finn.no-style sidebar + results
       ========================================================================= */
    .utforsk-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 32px;
      align-items: start;
      padding-bottom: 80px;
    }
    @media (max-width: 1023px) {
      .utforsk-layout { grid-template-columns: 1fr; gap: 0; }
    }

    /* --- Sidebar --- */
    .utforsk-sidebar {
      background: var(--cream-100);
      border-radius: var(--radius-lg);
      padding: 24px;
      position: sticky;
      top: 88px;
      max-height: calc(100dvh - 104px);
      overflow-y: auto;
    }
    .utforsk-sidebar__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--stone-200);
    }
    .utforsk-sidebar__title {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .utforsk-sidebar__count {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: var(--rouge-500);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      line-height: 1.5;
      min-width: 18px;
      text-align: center;
    }
    .utforsk-sidebar__sections {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .filter-section {
      padding-top: 22px;
      padding-bottom: 18px;
      border-top: 1px solid var(--stone-200);
    }
    .filter-section:last-child { padding-bottom: 0; }
    .filter-section:first-child {
      padding-top: 0;
      border-top: 0;
    }
    .filter-section__label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rouge-700);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 10px;
      border-left: 3px solid var(--rouge-500);
      line-height: 1;
      margin: 0 0 14px;
    }
    .filter-section__label .filter-section__chev {
      width: 14px; height: 14px;
      transition: transform 200ms var(--ease-out-soft);
      color: var(--rouge-700);
    }
    .filter-section.is-collapsed .filter-section__chev { transform: rotate(-90deg); }
    .filter-section__body {
      max-height: 1200px;
      transition: max-height 260ms var(--ease-out-soft), opacity 200ms var(--ease-out-soft);
      opacity: 1;
      overflow: visible;
    }
    .filter-section.is-collapsed .filter-section__body {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
    }

    /* --- Accordion (Sted) --- */
    .accordion {
      border-radius: 8px;
      overflow: hidden;
    }
    .accordion__trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      background: var(--cream-50);
      border: 1px solid var(--stone-200);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
      transition: border-color var(--dur-fast) var(--ease-out-soft);
    }
    .accordion__trigger:hover { border-color: var(--stone-300); }
    .accordion__trigger i { width: 14px; height: 14px; color: var(--fg-muted); transition: transform 180ms var(--ease-out-soft); }
    .accordion.is-open .accordion__trigger i { transform: rotate(90deg); color: var(--rouge-500); }
    .accordion__body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 220ms var(--ease-out-soft);
    }
    .accordion.is-open .accordion__body { max-height: 720px; }
    .accordion__list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 0 4px;
    }
    .filter-row-vertical { display: flex; flex-direction: column; gap: 2px; }

    /* Sted-søkefelt (erstatter den gamle fylke/by-listen). */
    .sted-search {
      position: relative;
      display: flex;
      align-items: center;
    }
    .sted-search .nailed-places-wrap { flex: 1 1 auto; width: 100%; }
    .sted-search__icon {
      position: absolute;
      left: 12px;
      width: 14px; height: 14px;
      color: var(--fg-muted);
      pointer-events: none;
      z-index: 1;
    }
    .sted-search__input {
      width: 100%;
      padding: 9px 36px 9px 32px;
      text-align: left;
      border: 1px solid var(--stone-200);
      border-radius: 999px;
      background: var(--cream-50);
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--ink);
    }
    .sted-search__input:focus {
      outline: none;
      border-color: var(--rouge-500);
    }
    .sted-search__clear {
      position: absolute;
      right: 6px;
      width: 26px; height: 26px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--fg-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .sted-search__clear:hover { color: var(--ink); background: var(--cream-100); }
    .sted-search__clear i { width: 14px; height: 14px; }
    /* Aldri vis legacy fylke/city-listene — søke-input erstatter dem. */
    #fylkeRow, #cityRow { display: none !important; }

    /* Eksisterende fylke-css beholdes for kompatibilitet med skjulte noder. */
       Valg vises i sted-trigger-knappen — vi unngår å markere det valgte
       fylket i listen så det ikke dobles. ✕-clear-spannen skjules. */
    #fylkeRow .v-pill,
    #fylkeRow .v-pill.active {
      background: transparent;
      border: 0;
      border-left: 3px solid transparent;
      color: var(--ink);
      font-weight: 500;
      justify-content: flex-start;
      border-radius: 8px;
    }
    #fylkeRow .v-pill:hover { background: var(--cream-50); }
    #fylkeRow .v-pill__clear { display: none !important; }

    /* --- Vertical pill (sidebar list item) --- */
    .v-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 34px;
      padding: 7px 10px 7px 9px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: background var(--dur-fast) var(--ease-out-soft), color var(--dur-fast) var(--ease-out-soft), border-color var(--dur-fast) var(--ease-out-soft);
    }
    .v-pill:hover { background: var(--cream-50); }
    .v-pill.active {
      background: var(--rouge-50);
      color: var(--rouge-700);
      font-weight: 600;
      border-left-color: var(--rouge-500);
    }
    .v-pill i {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--fg-muted);
    }
    .v-pill.active i { color: var(--rouge-500); }

    /* Sub-list (cities inside fylke accordion) */
    .v-pill--sub {
      padding-left: 24px;
      font-size: 12px;
      color: var(--fg-muted);
      min-height: 30px;
      font-weight: 500;
    }
    .v-pill--sub.active { color: var(--rouge-700); }

    /* --- Checkbox-style filter row (snarveier) --- */
    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 34px;
      padding: 6px 10px;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: background var(--dur-fast) var(--ease-out-soft);
    }
    .check-row:hover { background: var(--cream-50); }
    .check-row__box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--stone-300);
      background: var(--cream-50);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--dur-fast) var(--ease-out-soft);
    }
    .check-row__box::after {
      content: '';
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0);
      transition: transform 160ms var(--ease-out-soft);
      margin-top: -2px;
    }
    .check-row.is-checked { color: var(--rouge-700); font-weight: 600; }
    .check-row.is-checked .check-row__box {
      background: var(--rouge-500);
      border-color: var(--rouge-500);
    }
    .check-row.is-checked .check-row__box::after { transform: rotate(45deg) scale(1); }
    .check-row__label { flex: 1; }
    .check-row i { width: 13px; height: 13px; color: var(--fg-muted); }

    /* --- Toggle row (annet — switch on right) --- */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 38px;
      padding: 7px 10px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: background var(--dur-fast) var(--ease-out-soft);
    }
    .toggle-row:hover { background: var(--cream-50); }
    .toggle-row__switch {
      flex-shrink: 0;
      width: 32px;
      height: 18px;
      border-radius: 999px;
      background: var(--stone-200);
      position: relative;
      transition: background var(--dur-fast) var(--ease-out-soft);
    }
    .toggle-row__switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(27, 18, 24, 0.18);
      transition: transform var(--dur-fast) var(--ease-out-soft);
    }
    .toggle-row.is-checked { color: var(--rouge-700); font-weight: 600; }
    .toggle-row.is-checked .toggle-row__switch { background: var(--rouge-500); }
    .toggle-row.is-checked .toggle-row__switch::after { transform: translateX(14px); }

    /* --- Price range, max-duration select, rating stars --- */
    .filter-field { display: flex; flex-direction: column; gap: 6px; }
    .filter-field__pair { display: flex; gap: 8px; align-items: center; }
    .filter-field__pair input { flex: 1; min-width: 0; }
    .filter-field__pair span { color: var(--stone-300); font-size: 13px; }
    .filter-field input[type="number"],
    .filter-field select {
      font-family: var(--font-body);
      font-size: 13px;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--stone-200);
      background: var(--cream-50);
      color: var(--ink);
      width: 100%;
      box-sizing: border-box;
      transition: border-color var(--dur-fast) var(--ease-out-soft), box-shadow var(--dur-fast) var(--ease-out-soft);
    }
    .filter-field input[type="number"]:focus,
    .filter-field select:focus {
      outline: none;
      border-color: var(--rouge-300);
      box-shadow: 0 0 0 3px var(--rouge-50);
    }
    .filter-field input[type="number"]::placeholder { color: var(--stone-300); }

    .rating-stars {
      display: inline-flex;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 8px;
      transition: background var(--dur-fast) var(--ease-out-soft);
    }
    .rating-stars.has-selection { background: var(--rouge-50); }
    .rating-stars button {
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 2px;
      color: var(--stone-300);
      transition: color var(--dur-fast) var(--ease-out-soft);
    }
    .rating-stars button.is-on { color: var(--rouge-500); }
    /* Cascade hover-fill: rouge from start up to hovered star, muted after. */
    .rating-stars:hover button { color: var(--rouge-400); }
    .rating-stars:hover button:hover ~ button { color: var(--stone-300); }
    .rating-stars i { width: 24px; height: 24px; fill: currentColor; stroke: currentColor; }

    /* --- Sidebar footer (reset / apply) --- */
    .utforsk-sidebar__footer {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--stone-200);
      display: flex;
      gap: 8px;
    }
    .utforsk-sidebar__footer .btn { flex: 1; }
    .filter-reset-ghost {
      flex: 1;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 13px;
      color: var(--rouge-500);
      background: transparent;
      border: 1px solid var(--rouge-100);
      border-radius: var(--radius-pill);
      padding: 9px 16px;
      cursor: pointer;
      transition: background var(--dur-fast) var(--ease-out-soft), color var(--dur-fast) var(--ease-out-soft), border-color var(--dur-fast) var(--ease-out-soft);
    }
    .filter-reset-ghost:hover:not(:disabled) {
      background: var(--rouge-50);
      color: var(--rouge-700);
      border-color: var(--rouge-200);
    }
    .filter-reset-ghost:disabled {
      color: var(--stone-300);
      border-color: var(--stone-200);
      background: transparent;
      cursor: not-allowed;
    }
    /* Apply button is only meaningful on mobile (filters apply live on desktop). */
    .utforsk-sidebar__apply { display: none; }

    /* --- Main column --- */
    .utforsk-main { min-width: 0; }
    .utforsk-main__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0 16px;
      flex-wrap: wrap;
    }
    .utforsk-main__head-count {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--fg-muted);
    }
    .utforsk-main__head-count strong { color: var(--ink); font-weight: 700; }
    .utforsk-main__head-right {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--fg-muted);
    }
    .utforsk-main__head-right select {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 13px;
      color: var(--ink);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 4px 0;
    }

    /* Active filter chip-strip (kept as-is for de-select UX) */
    .utforsk-main__active { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 0 12px; }

    /* Results: en og en salong stablet under hverandre. Kortet får
       horisontal layout (bilde til venstre, info til høyre) på desktop. */
    .utforsk-results {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    /* Sidenummerering under salong-grid */
    .utforsk-pagination {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin: 32px 0 8px;
    }
    .utforsk-pagination__btn {
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--stone-200);
      background: var(--cream-50);
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all 120ms ease;
    }
    .utforsk-pagination__btn:hover { border-color: var(--stone-400); }
    .utforsk-pagination__btn.is-active {
      background: var(--ink); color: #fff; border-color: var(--ink); cursor: default;
    }
    .utforsk-pagination__btn[disabled] {
      opacity: 0.4; cursor: not-allowed;
    }
    .utforsk-pagination__ellipsis {
      color: var(--fg-muted); padding: 0 4px;
    }
    .utforsk-pagination[hidden] { display: none; }
    @media (max-width: 720px) {
      .utforsk-pagination__btn { min-width: 34px; height: 34px; padding: 0 8px; font-size: 13px; }
    }
    @media (min-width: 720px) {
      .utforsk-results .service-card {
        flex-direction: row;
        align-items: stretch;
        /* Fast høyde 260px matcher original. Bottom-gruppen pinnes
           absolutt mot bunnen i sc2-body istedenfor å vokse kortet. */
        height: 260px;
      }
      .utforsk-results .service-card__photo {
        flex: 0 0 280px;
        aspect-ratio: auto;
      }
      .utforsk-results .service-card__body {
        flex: 1;
      }
    }
    /* Nytt salongkort-layout (sc2). Status-pill går inn i info-kolonnen,
       pris dyttes ned i høyre hjørne, kategorier/behandlere klistret til
       bunnen så det blir luft mellom rating og chips. */
    .utforsk-results .sc2-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 22px 26px 18px;
      position: relative;
    }
    /* Bottom-gruppen pines absolutt mot bunnen av sc2-body istedenfor å
       presse kortet større. Scope'et til utforsk så vi ikke leaker
       absolute-positioning til forsidens vertikale kort. */
    .utforsk-results .sc2-bottom {
      position: absolute;
      left: 26px;
      right: 26px;
      bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    /* Hjerteknappen ligger nå INNE i info-kolonnen, øverst til høyre. */
    .utforsk-results .sc2-body { position: relative; }
    .utforsk-results .service-card__heart {
      position: absolute;
      top: 14px;
      right: 14px;
      left: auto;
    }
    .sc2-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      width: fit-content;
    }
    .sc2-status--open { background: #dcfce7; color: #166534; }
    .sc2-status--closed { background: var(--stone-100); color: var(--fg-muted); }
    .sc2-status__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .sc2-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1.15;
      margin-top: 12px;
    }
    .sc2-meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--fg-muted);
    }
    .sc2-meta__item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .sc2-meta__item i { width: 14px; height: 14px; }
    .sc2-meta__sub { color: var(--stone-400); font-weight: 500; }
    .sc2-cats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .sc2-cat {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--rouge-50);
      color: var(--rouge-500);
    }
    .sc2-team {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--fg-muted);
    }
    .sc2-team i { width: 14px; height: 14px; flex-shrink: 0; }
    .sc2-team span { color: var(--ink); font-weight: 500; }
    .sc2-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .sc2-footer .sc2-cats { flex: 1; min-width: 0; }
    .sc2-footer .sc2-price { flex-shrink: 0; }
    .sc2-price {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      background: var(--cream-100);
      padding: 8px 14px;
      border-radius: 12px;
    }
    .sc2-price__from { font-size: 12px; color: var(--fg-muted); font-weight: 500; }
    .sc2-price__amount {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 22px;
      color: var(--ink);
      line-height: 1;
    }
    .sc2-price__unit { font-size: 12px; color: var(--fg-muted); font-weight: 500; }
    .utforsk-results-state {
      grid-column: 1 / -1;
      padding: 48px 16px;
      text-align: center;
      color: var(--fg-muted);
      font-size: 14px;
    }

    /* Card polish — consistent aspect ratio & gentle hover lift. */
    .utforsk-results .service-card {
      transition: transform 220ms var(--ease-out-soft), box-shadow 220ms var(--ease-out-soft);
    }
    .utforsk-results .service-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(27, 18, 24, 0.06);
    }
    .utforsk-results .service-card__photo {
      aspect-ratio: 16 / 11;
    }

    /* Mobil-only: matcher forsidekort-stilen — vertikalt kort, hjerte beholdes
       oppe på bildet, rating absolutt-plassert øverst-høyre i info-arealet,
       cats+pris flyter i normal flow (ikke absolutt-pinnet til bunn). */
    @media (max-width: 720px) {
      .utforsk-results .sc2-status,
      .utforsk-results .sc2-team { display: none; }
      .utforsk-results .sc2-meta__item--city i { display: none; }
      .utforsk-results .sc2-meta__city-text::before { content: "Behandler i "; }

      /* sc2-body på mobil: normal flow, ingen fast høyde, ingen absolutt bottom-gruppe */
      .utforsk-results .sc2-body {
        padding: 18px 18px 16px;
        gap: 6px;
        min-height: 0;
      }
      .utforsk-results .sc2-bottom {
        position: static;
        left: auto;
        right: auto;
        bottom: auto;
        margin-top: 10px;
      }
      .utforsk-results .sc2-name {
        font-size: 19px;
        margin-top: 0;
        /* La navnet vike for absolutt-plassert rating i hjørnet */
        padding-right: 80px;
      }
      .utforsk-results .sc2-meta { padding-right: 80px; }

      /* Hjertet plasseres på selve bildet via JS (moveHeartsOnMobile).
         Det havner inne i .service-card__photo og positioneres top-right. */
      .utforsk-results .service-card__heart {
        top: 12px;
        right: 12px;
        left: auto;
      }

      /* Rating øvre høyre hjørne av info-arealet (under bildet) */
      .utforsk-results .sc2-meta__item--rating {
        position: absolute;
        top: 18px;
        right: 18px;
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        background: transparent;
      }
      .utforsk-results .sc2-meta__item--rating i {
        color: var(--rouge-500);
        fill: var(--rouge-500);
      }
      .utforsk-results .sc2-meta__item--rating .sc2-meta__sub {
        color: var(--stone-400);
        font-weight: 500;
      }
    }

    /* Mobile filter button — shown only when sidebar is drawer-mode. */
    .mobile-filter-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0 14px;
    }
    .mobile-filter-bar__btn {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 13px;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--stone-300);
      background: var(--cream-50);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }
    .mobile-filter-bar__btn i { width: 14px; height: 14px; }
    .mobile-filter-bar__count {
      background: var(--rouge-500);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: var(--radius-pill);
      min-width: 18px;
      text-align: center;
    }

    /* Drawer + backdrop (mobile only). */
    .filter-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(27, 18, 24, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms var(--ease-out-soft);
      z-index: 1190;
    }
    .filter-backdrop.is-open { opacity: 1; pointer-events: auto; }

    @media (max-width: 1023px) {
      .utforsk-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100dvh;
        max-height: 100dvh;
        width: 80vw;
        max-width: 360px;
        z-index: 1200;
        transform: translateX(-100%);
        transition: transform 240ms var(--ease-out-soft);
        border-radius: 0;
        box-shadow: 0 0 30px rgba(0,0,0,0.18);
        padding-bottom: 100px;
      }
      .utforsk-sidebar.is-open { transform: translateX(0); }
      .utforsk-sidebar__head { position: relative; }
      .utforsk-sidebar__close {
        background: transparent;
        border: 0;
        cursor: pointer;
        padding: 4px;
        color: var(--ink);
        display: inline-flex;
      }
      .utforsk-sidebar__close i { width: 18px; height: 18px; }
      .utforsk-sidebar__apply { display: inline-flex; }
      .mobile-filter-bar { display: flex; }
    }
    @media (min-width: 1024px) {
      .utforsk-sidebar__close { display: none; }
    }

    /* =========================================================================
       Salon card extras (preserved from previous design)
       ========================================================================= */
    .card-pill {
      position: absolute;
      top: 12px;
      left: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px 5px 8px;
      background: rgba(251, 246, 238, 0.94);
      backdrop-filter: blur(8px);
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.02em;
    }
    .card-pill__dot {
      width: 7px; height: 7px; border-radius: 999px; background: var(--stone-400);
    }
    .card-pill--open .card-pill__dot { background: #2EA66F; box-shadow: 0 0 0 3px rgba(46, 166, 111, 0.16); }
    .card-pill--closed .card-pill__dot { background: var(--rouge-500); }
    .card-pill--closed-today .card-pill__dot { background: var(--stone-500); }
    .card-pill__sep { color: var(--stone-400); margin: 0 1px; }
    .card-pill__sub { color: var(--fg-muted); font-weight: 500; }

    .service-card__info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .service-card__info .service-card__name { margin-bottom: 2px; }
    .service-card__info .service-card__meta { font-size: 12px; }
    .service-card__info .service-card__meta i { width: 12px; height: 12px; }
    .service-card__rating {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 13px; color: var(--ink); font-weight: 600;
    }
    .service-card__rating i { width: 14px; height: 14px; color: var(--rouge-500); fill: var(--rouge-500); }
    .service-card__rating-count { color: var(--fg-muted); font-weight: 500; font-size: 12px; }
    .service-card__catchip {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--rouge-700);
      background: var(--rouge-50);
      border: 1px solid var(--rouge-100);
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Top navigation -->
  <header class="top-nav" id="topNav">

  <!-- Hero title — Filter-knapp vises kun på mobil via CSS (på desktop ligger
       den i sidebar-en). -->
  <section class="utforsk-hero">
    <div class="page utforsk-hero__inner">
      <h1 class="utforsk-hero__title">Utforsk <em>Norge</em></h1>
      <button class="utforsk-hero__filter-btn" id="filterBtnHero" type="button" aria-expanded="false" aria-controls="filterSidebar">
        <i data-lucide="sliders-horizontal"></i> Filter
        <span class="utforsk-hero__filter-count" id="filterBtnCountHero" hidden>0</span>
      </button>
    </div>
  </section>

  <!-- Backdrop for mobile drawer -->
  <div class="filter-backdrop" id="filterBackdrop" aria-hidden="true"></div>

  <!-- Two-column body -->
  <section class="page utforsk-layout">

    <!-- Sidebar / filter drawer -->
    <aside class="utforsk-sidebar" id="filterSidebar" aria-label="Filter">
      <div class="utforsk-sidebar__head">
        <h2 class="utforsk-sidebar__title">
          Filter
          <span class="utforsk-sidebar__count" id="filterBtnCount" style="display:none;">0</span>
        </h2>
        <button type="button" class="utforsk-sidebar__close" id="filterClose" aria-label="Lukk filter">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="utforsk-sidebar__sections">

        <!-- Sted (søk) -->
        <div class="filter-section">
          <p class="filter-section__label">Sted</p>
          <div class="sted-search" id="stedSearchWrap">
            <i data-lucide="search" class="sted-search__icon"></i>
            <input type="text" id="stedSearch" class="sted-search__input" placeholder="Søk fylke, by eller sted" autocomplete="off" />
            <button type="button" class="sted-search__clear" id="stedSearchClear" aria-label="Nullstill" hidden>
              <i data-lucide="x"></i>
            </button>
          </div>
          <!-- Hidden compatibility nodes — eksisterende JS leser disse. -->
          <div id="fylkeRow" style="display:none;"><button data-fylke="all" class="active">Hele Norge</button></div>
          <div id="cityRow" style="display:none;"><div id="citiesInner"></div></div>
        </div>

        <!-- Behandling -->
        <div class="filter-section">
          <p class="filter-section__label">Behandling</p>
          <div class="filter-row-vertical" id="treatmentRow">
            <button class="v-pill active" data-tx="all"><i data-lucide="layout-grid"></i><span>Alt</span></button>
            <button class="v-pill" data-tx="nails"><i data-lucide="sparkles"></i><span>Negler</span></button>
            <button class="v-pill" data-tx="lashes"><i data-lucide="eye"></i><span>Vipper</span></button>
            <button class="v-pill" data-tx="brows"><i data-lucide="tag"></i><span>Bryn</span></button>
            <button class="v-pill" data-tx="makeup"><i data-lucide="palette"></i><span>Makeup</span></button>
            <button class="v-pill" data-tx="hair"><i data-lucide="scissors"></i><span>Hår</span></button>
            <button class="v-pill" data-tx="wax"><i data-lucide="tag"></i><span>Voksing</span></button>
            <button class="v-pill" data-tx="tan"><i data-lucide="tag"></i><span>Spraytan</span></button>
            <button class="v-pill" data-tx="massage"><i data-lucide="tag"></i><span>Massasje</span></button>
          </div>
          <!-- Hidden: pill list above already filters category. Kept as input so JS contracts don't break. -->
          <input type="hidden" id="fCategory" value="" />
        </div>

        <!-- Pris -->
        <div class="filter-section">
          <p class="filter-section__label">Pris</p>
          <div class="filter-field">
            <div class="filter-field__pair">
              <input type="number" id="fMinPrice" min="0" step="50" placeholder="Min kr" inputmode="numeric" aria-label="Minimum pris i kroner" />
              <span>–</span>
              <input type="number" id="fMaxPrice" min="0" step="50" placeholder="Maks kr" inputmode="numeric" aria-label="Maks pris i kroner" />
            </div>
          </div>
        </div>

        <!-- Varighet -->
        <div class="filter-section">
          <p class="filter-section__label">Maks varighet</p>
          <div class="filter-field">
            <select id="fMaxDuration">
              <option value="">Alle</option>
              <option value="30">30 min</option>
              <option value="60">60 min</option>
              <option value="90">90 min</option>
              <option value="120">120 min</option>
              <option value="180">180 min</option>
            </select>
          </div>
        </div>

        <!-- Snarveier (Annet) -->
        <div class="filter-section">
          <p class="filter-section__label">Snarveier</p>
          <div class="filter-row-vertical" id="quickRow">
            <button type="button" class="check-row" data-quick="today">
              <span class="check-row__box"></span>
              <span class="check-row__label">I dag</span>
            </button>
            <button type="button" class="check-row" data-quick="tomorrow">
              <span class="check-row__box"></span>
              <span class="check-row__label">I morgen</span>
            </button>
            <button type="button" class="check-row" data-quick="popular">
              <span class="check-row__box"></span>
              <span class="check-row__label">Populære nå</span>
            </button>
            <button type="button" class="check-row" data-quick="new">
              <span class="check-row__box"></span>
              <span class="check-row__label">Nye</span>
            </button>
            <button type="button" class="check-row" data-quick="topRated">
              <span class="check-row__box"></span>
              <span class="check-row__label">Topp vurdert</span>
            </button>
            <button type="button" class="check-row" data-quick="budget">
              <span class="check-row__box"></span>
              <span class="check-row__label">Under 800 kr</span>
            </button>
            <button type="button" class="check-row" data-quick="home">
              <span class="check-row__box"></span>
              <span class="check-row__label">Hjemmebesøk</span>
            </button>
            <button type="button" class="check-row" data-quick="evening">
              <span class="check-row__box"></span>
              <span class="check-row__label">Kveld</span>
            </button>
          </div>
        </div>

        <!-- Annet (server-side toggles) -->
        <div class="filter-section">
          <p class="filter-section__label">Annet</p>
          <div class="filter-row-vertical">
            <button type="button" class="toggle-row" id="fOpenNowRow" aria-pressed="false">
              <span class="toggle-row__label">Åpent nå</span>
              <span class="toggle-row__switch" aria-hidden="true"></span>
            </button>
            <button type="button" class="toggle-row" id="fHasReviewsRow" aria-pressed="false">
              <span class="toggle-row__label">Har anmeldelser</span>
              <span class="toggle-row__switch" aria-hidden="true"></span>
            </button>
          </div>
          <!-- Hidden inputs preserve existing JS contract. -->
          <input type="checkbox" id="fOpenNow" style="display:none;" />
          <input type="checkbox" id="fHasReviews" style="display:none;" />
        </div>

      </div>

      <div class="utforsk-sidebar__footer">
        <button class="filter-reset-ghost" id="filterReset" type="button" disabled>Nullstill</button>
        <button class="btn btn-primary btn-sm utforsk-sidebar__apply" id="filterApply" type="button">Anvend filter</button>
      </div>
    </aside>

    <!-- Main column -->
    <div class="utforsk-main">

      <div class="utforsk-main__head">
        <span class="utforsk-main__head-count" id="resultsHeadCount">Laster behandlere…</span>
        <div class="utforsk-main__head-right">
          Sortér
          <select id="sortSelect">
            <option value="relevant">Mest relevant</option>
            <option value="next">Neste ledige time</option>
            <option value="price">Lavest pris</option>
            <option value="rating">Best vurdert</option>
          </select>
        </div>
      </div>

      <div class="utforsk-main__active" id="activeFilters"></div>

      <div class="utforsk-results" id="resultsGrid">
        <div class="utforsk-results-state" id="resultsState"></div>
      </div>
      <nav class="utforsk-pagination" id="utforskPagination" aria-label="Sidenummerering" hidden></nav>

  <!-- Footer -->
  <footer id="siteFooter"></footer>
  <script defer src="/assets/footer.js"></script>
  <script defer src="/assets/bottom-nav.js"></script>
  <script defer src="/assets/keyboard-inset.js"></script>

  <script defer src="/assets/install-prompt.js"></script>
  <script defer src="/assets/nav-progress.js"></script>
  <script defer src="/assets/avatar.js"></script>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/assets/auth.js"></script>
  <script src="favorites.js"></script>
  <script src="/assets/no-places.js"></script>
  <script defer src="/assets/cookie-banner.js"></script>
  <script defer src="/assets/nav.js"></script>
  <script defer src="/assets/track.js"></script>
  <script defer src="/assets/spa-nav.js"></script>
  <script defer src="/assets/topnav-scroll.js"></script>
  <script>
    lucide.createIcons();

    // Nav scroll — håndtert av /assets/topnav-scroll.js

    // City data — used by city sub-list UI
    var CITIES = {
      oslo: ['Sentrum','Grünerløkka','Frogner','Majorstuen','Sagene','St. Hanshaugen','Tøyen','Bislett','Bjørvika','Grønland'],
      akershus: ['Bærum','Asker','Lillestrøm','Ullensaker','Nordre Follo','Nesodden'],
      vestland: ['Bergen','Voss','Førde','Sogndal','Askøy','Os'],
      rogaland: ['Stavanger','Sandnes','Haugesund','Bryne','Egersund'],
      trondelag: ['Trondheim','Stjørdal','Steinkjer','Levanger','Namsos'],
      innlandet: ['Hamar','Lillehammer','Gjøvik','Elverum'],
      ostfold: ['Fredrikstad','Sarpsborg','Moss','Halden','Askim'],
      agder: ['Kristiansand','Arendal','Mandal','Grimstad'],
      buskerud: ['Drammen','Kongsberg','Ringerike','Hønefoss'],
      mr: ['Ålesund','Molde','Kristiansund','Ulsteinvik'],
      vestfold: ['Tønsberg','Sandefjord','Larvik','Horten'],
      nordland: ['Bodø','Mo i Rana','Narvik','Svolvær'],
      telemark: ['Skien','Porsgrunn','Notodden','Bø'],
      troms: ['Tromsø','Harstad','Finnsnes'],
      finnmark: ['Alta','Hammerfest','Kirkenes','Vadsø']
    };

    var CITY_TO_FYLKE = {};
    Object.keys(CITIES).forEach(function (k) {
      CITIES[k].forEach(function (city) { CITY_TO_FYLKE[city.toLowerCase()] = k; });
    });

    var FALLBACK_GRADIENTS = [
      'linear-gradient(135deg, #FFE0E9, #FFC4D6)',
      'linear-gradient(135deg, #F4ECDF, #E8DCC4)',
      'linear-gradient(135deg, #FFF1F5, #FB6B9A)',
      'linear-gradient(135deg, #DDE3D2, #8DA079)',
      'linear-gradient(135deg, #FFC4D6, #82103D)',
      'linear-gradient(135deg, #ECDFCB, #C9B79A)',
      'linear-gradient(135deg, #F4ECDF, #B89870)',
      'linear-gradient(135deg, #FFE0E9, #B8536F)',
      'linear-gradient(135deg, #DDE3D2, #7B8E68)',
      'linear-gradient(135deg, #ECDFCB, #82103D)'
    ];

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function gradientFor(id) {
      var n = (typeof id === 'number' ? id : 0);
      return FALLBACK_GRADIENTS[Math.abs(n) % FALLBACK_GRADIENTS.length];
    }

    function fylkeForCity(city) {
      if (!city) return '';
      var k = CITY_TO_FYLKE[String(city).toLowerCase()];
      return k || '';
    }

    var currentFylke = 'all';
    var currentCity = null;
    var currentTx = 'all';
    var activeQuick = [];

    var ALL_SALONS = [];
    var FAV_SET = new Set();

    // Filter-persistens: URL er kilden, men hvis URL er bar (bruker klikket
     // «Utforsk» i top-nav etter å ha filtrert) faller vi tilbake til siste
     // valgte filtre fra sessionStorage. Slik mister man ikke filtervalg ved
     // tilbake-navigering.
    var initialParams = new URLSearchParams(window.location.search);
    if (initialParams.toString() === '') {
      try {
        var saved = sessionStorage.getItem('nailed.utforsk.filters');
        if (saved) {
          var savedParams = new URLSearchParams(saved);
          if (savedParams.toString() !== '') {
            initialParams = savedParams;
            history.replaceState(null, '', window.location.pathname + '?' + saved);
          }
        }
      } catch (_) {}
    }
    var currentQ = (initialParams.get('q') || '').trim();
    var initialCityParam = (initialParams.get('city') || '').trim();
    if (initialCityParam) {
      currentCity = initialCityParam;
      var fk = fylkeForCity(initialCityParam);
      if (fk) currentFylke = fk;
    }

    function parseIntOrNull(v) {
      if (v == null || v === '') return null;
      var n = parseInt(v, 10);
      return Number.isFinite(n) ? n : null;
    }
    var fState = {
      min_price: parseIntOrNull(initialParams.get('min_price')),
      max_price: parseIntOrNull(initialParams.get('max_price')),
      max_duration: parseIntOrNull(initialParams.get('max_duration')),
      category: (initialParams.get('category') || '').trim(),
      min_rating: parseIntOrNull(initialParams.get('min_rating')),
      open_now: initialParams.get('open_now') === '1',
      has_reviews: initialParams.get('has_reviews') === '1',
    };

    function syncUrl() {
      var parts = [];
      if (currentQ) parts.push('q=' + encodeURIComponent(currentQ));
      if (currentCity) parts.push('city=' + encodeURIComponent(currentCity));
      if (fState.min_price != null) parts.push('min_price=' + fState.min_price);
      if (fState.max_price != null) parts.push('max_price=' + fState.max_price);
      if (fState.max_duration != null) parts.push('max_duration=' + fState.max_duration);
      if (fState.category) parts.push('category=' + encodeURIComponent(fState.category));
      if (fState.min_rating != null) parts.push('min_rating=' + fState.min_rating);
      if (fState.open_now) parts.push('open_now=1');
      if (fState.has_reviews) parts.push('has_reviews=1');
      var qs = parts.join('&');
      var newUrl = window.location.pathname + (parts.length ? '?' + qs : '');
      try { history.replaceState(null, '', newUrl); } catch (_) {}
      // Husk filtre i sessionStorage så «Tilbake til utforsk» fra salongsiden
      // gjenoppretter dem hvis brukeren havner på bar URL.
      try { sessionStorage.setItem('nailed.utforsk.filters', qs); } catch (_) {}
    }

    function countAdvanced() {
      var n = 0;
      if (fState.min_price != null) n++;
      if (fState.max_price != null) n++;
      if (fState.max_duration != null) n++;
      if (fState.category) n++;
      if (fState.min_rating != null) n++;
      if (fState.open_now) n++;
      if (fState.has_reviews) n++;
      if (currentFylke !== 'all') n++;
      if (currentCity) n++;
      if (currentTx !== 'all') n++;
      if (activeQuick.length) n += activeQuick.length;
      return n;
    }
    function refreshFilterBtnBadge() {
      var badge = document.getElementById('filterBtnCount');
      var heroBadge = document.getElementById('filterBtnCountHero');
      var n = countAdvanced();
      if (badge) {
        if (n > 0) { badge.textContent = String(n); badge.style.display = 'inline-flex'; }
        else { badge.style.display = 'none'; }
      }
      if (heroBadge) {
        if (n > 0) { heroBadge.textContent = String(n); heroBadge.hidden = false; }
        else { heroBadge.hidden = true; }
      }
      var resetBtn = document.getElementById('filterReset');
      if (resetBtn) resetBtn.disabled = (n === 0);
      var starsBox = document.getElementById('fRatingStars');
      if (starsBox) starsBox.classList.toggle('has-selection', fState.min_rating != null);
    }

    // --- Sted accordion (legacy — markup byttet til søkefelt; guards) -------
    var stedAccordion = document.getElementById('stedAccordion');
    var stedTrigger = document.getElementById('stedTrigger');
    var stedTriggerLabel = document.getElementById('stedTriggerLabel');
    if (stedTrigger && stedAccordion) {
      stedTrigger.addEventListener('click', function () {
        var open = !stedAccordion.classList.contains('is-open');
        stedAccordion.classList.toggle('is-open', open);
        stedTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

    // Click-to-collapse på filter-seksjons-overskrifter. Wrapper alt etter
    // .filter-section__label i en .filter-section__body slik at vi får
    // smooth max-height/opacity-overgang. Legger til chevron-ikon.
    document.querySelectorAll('.filter-section').forEach(function (section) {
      var label = section.querySelector('.filter-section__label');
      if (!label) return;
      // Append chevron to label
      if (!label.querySelector('.filter-section__chev')) {
        var chev = document.createElement('i');
        chev.setAttribute('data-lucide', 'chevron-down');
        chev.className = 'filter-section__chev';
        label.appendChild(chev);
      }
      // Wrap siblings after label in a body
      var siblings = [];
      var n = label.nextElementSibling;
      while (n) { siblings.push(n); n = n.nextElementSibling; }
      if (siblings.length && !section.querySelector('.filter-section__body')) {
        var body = document.createElement('div');
        body.className = 'filter-section__body';
        siblings.forEach(function (el) { body.appendChild(el); });
        section.appendChild(body);
      }
      label.addEventListener('click', function () {
        section.classList.toggle('is-collapsed');
      });
    });

    function updateStedLabel() {
      if (!stedTriggerLabel) return;
      if (currentCity) { stedTriggerLabel.textContent = currentCity; return; }
      if (currentFylke === 'all') { stedTriggerLabel.textContent = 'Hele Norge'; return; }

    // --- Sted-søk: én input som typeahead'er kommune/tettsted/bydel -------
    var FYLKER = ['Oslo','Akershus','Vestland','Rogaland','Trøndelag','Innlandet','Østfold','Agder','Buskerud','Møre og Romsdal','Vestfold','Nordland','Telemark','Troms','Finnmark'];
    (function wireStedSearch() {
      var input = document.getElementById('stedSearch');
      var clearBtn = document.getElementById('stedSearchClear');
      if (!input) return;
      function tryAttach() {
        if (window.NailedPlaces && NailedPlaces.attachTypeahead) {
          NailedPlaces.attachTypeahead(input, { permissive: true });
          return true;
        }
        return false;
      }
      if (!tryAttach()) {
        // Script may not have finished — retry on next tick + after load.
        setTimeout(tryAttach, 0);
        window.addEventListener('load', tryAttach);
      }
      function applySearchValue() {
        var v = (input.value || '').trim();
        clearBtn.hidden = !v;
        if (!v) {
          currentFylke = 'all';
          currentCity = null;
        } else if (FYLKER.indexOf(v) >= 0) {
          // Fylke-treff: vi har ingen fylke-filter i API'et per nå, så vi
          // setter currentCity = null og lar brukeren se alle salonger.
          // (Backend støtter ikke fylke-filter direkte — vi kunne lagt det
          // til senere; nå er fylke-valget kun visuell intent.)
          currentFylke = v.toLowerCase().replace(/[^a-z]/g, '').slice(0, 12) || 'all';
          currentCity = null;
        } else {
          currentFylke = 'all';
          currentCity = v;
        }
        refreshFilterBtnBadge();
        syncUrl();
        filterResults();
      }
      input.addEventListener('change', applySearchValue);
      clearBtn.addEventListener('click', function () {
        input.value = '';
        if (input._nailedPlaces && input._nailedPlaces.setValue) input._nailedPlaces.setValue('');
        applySearchValue();
        input.focus();
      });
      // Seed from existing URL state
      if (currentCity) input.value = currentCity;
    })();

    function buildCard(salon) {
      var fylke = fylkeForCity(salon.city);
      var fylkeAttr = fylke || '';
      var cityAttr = salon.city || '';
      var photoStyle, photoInner;
      if (salon.cover_url) {
        photoStyle = '';
        // Bruk srcset hvis backend har generert varianter (nye v2-uploads).
        var srcset = '';
        if (salon.cover_url_400) {
          srcset = ' srcset="' + encodeURI(salon.cover_url_400) + ' 400w, '
                              + encodeURI(salon.cover_url_800) + ' 800w, '
                              + encodeURI(salon.cover_url_1600) + ' 1600w"'
                 + ' sizes="(max-width: 720px) 100vw, (max-width: 1200px) 50vw, 33vw"';
        }
        photoInner = '<img class="service-card__cover" src="' + encodeURI(salon.cover_url) + '"' + srcset + ' alt="" loading="lazy" decoding="async">';
      } else {
        photoStyle = 'background: ' + gradientFor(salon.id) + ';';
        photoInner = '';
      }

      var loggedInForFav = window.NailedAuth && NailedAuth.isLoggedIn();
      var isFav = loggedInForFav
        ? FAV_SET.has(salon.id)
        : (typeof isFavorite === 'function' && isFavorite(salon.slug || ''));
      var heartClass = 'service-card__heart' + (isFav ? ' is-favorite' : '');
      var heartFillStyle = isFav
        ? 'color:var(--rouge-500);fill:var(--rouge-500);'
        : '';

      var slug = encodeURIComponent(salon.slug || '');

      // Status-pill — vises nå i info-arealet, ikke på bildet.
      var statusPill;
      if (salon.is_open_now === true) {
        statusPill = '<span class="sc2-status sc2-status--open"><span class="sc2-status__dot"></span>Åpent nå</span>';
      } else if (salon.reopens_today) {
        statusPill = '<span class="sc2-status sc2-status--closed"><span class="sc2-status__dot"></span>Stengt · Åpner ' + escapeHtml(salon.reopens_today) + '</span>';
      } else {
        statusPill = '<span class="sc2-status sc2-status--closed"><span class="sc2-status__dot"></span>Stengt nå</span>';
      }

      var locationLine = salon.city
        ? '<span class="sc2-meta__item sc2-meta__item--city" data-city="' + escapeHtml(salon.city) + '"><i data-lucide="map-pin"></i><span class="sc2-meta__city-text">' + escapeHtml(salon.city) + '</span></span>'
        : '';

      var ratingLine = '';
      if (salon.avg_rating != null && salon.review_count > 0) {
        ratingLine = '<span class="sc2-meta__item sc2-meta__item--rating"><i data-lucide="star"></i>'
          + escapeHtml(salon.avg_rating.toFixed ? salon.avg_rating.toFixed(1) : String(salon.avg_rating))
          + ' <span class="sc2-meta__sub">(' + salon.review_count + ')</span></span>';
      }

      var catsHtml = '';
      if (Array.isArray(salon.top_categories) && salon.top_categories.length) {
        catsHtml = '<div class="sc2-cats">' +
          salon.top_categories.map(function (c) {
            return '<span class="sc2-cat">' + escapeHtml(c) + '</span>';
          }).join('') +
        '</div>';
      }

      var teamHtml = '';
      if (Array.isArray(salon.top_team) && salon.top_team.length) {
        teamHtml = '<div class="sc2-team"><i data-lucide="users"></i>' +
          '<span>' + escapeHtml(salon.top_team.join(', ')) + '</span>' +
        '</div>';
      }

      var priceHtml = '';
      if (salon.min_price != null) {
        priceHtml = '<div class="sc2-price">'
          + '<span class="sc2-price__from">Fra</span>'
          + '<span class="sc2-price__amount">' + salon.min_price + '</span>'
          + '<span class="sc2-price__unit">kr</span>'
        + '</div>';

      // Map norske kategorinavn til slug-ene filtreringspillene bruker
      // (data-tx="nails", "lashes", osv.). Brukes til klient-side filtrering
      // av allerede-loadede kort.
      var CAT_TO_TX = {
        'Negler': 'nails',
        'Vipper': 'lashes',
        'Bryn': 'brows',
        'Makeup': 'makeup',
        'Hår': 'hair',
        'Voksing': 'wax',
        'Hud': 'tan',
        'Spa': 'massage',
      };
      var txSlugs = Array.isArray(salon.top_categories)
        ? salon.top_categories.map(function (c) { return CAT_TO_TX[c] || ''; }).filter(Boolean)

      var txAttr = txSlugs.join(',');

      return ''
        + '<article class="service-card card" '
          + 'data-fylke="' + escapeHtml(fylkeAttr) + '" '
          + 'data-city="' + escapeHtml(cityAttr) + '" '

          + '<div class="service-card__body sc2-body">'
            + '<button class="' + heartClass + '" data-fav="' + escapeHtml(salon.slug || '') + '" data-salon-id="' + salon.id + '" aria-pressed="' + (isFav ? 'true' : 'false') + '">'
              + '<i data-lucide="heart" style="' + heartFillStyle + '"></i>'
